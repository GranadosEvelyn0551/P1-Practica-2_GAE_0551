<!DOCTYPE html>
<html lang="en"> <!-- el inicio del documento HTML y se indica el idioma-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Imagenes en HTML</title>
</head>

<body>
    <h2>Imagenes en HTML</h2>
    <h3>Locales</h3> <!--subtitulo para las imagenes guardadas localmente -->
    <!--muestra una imagen guardada en la misma carpeta -->
    <img src="caritas.png" alt="Imagen de carita feliz">
    <!--subtitulo para una imagen local con tamaño modificado -->
    <h3>Locales redismensionado</h3>

    <!--muestra una imagen local y establece su ancho y alto -->
    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <!--subtitulo para las imagenes obtenidas desde internet -->
    <h3>Desde internet</h3>

    <!--muestra una imagen utilizando una direccion de internet -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-
    illustration-happy-face-isolated-on-white.jpg"
    width="200" height="200"
    alt="">

    <!--subtitulo para mostrar una imagen animada -->
    <h3>Animaciones</h3>
    <!--muestra una animacion desde internet y establece su tamaño -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1Mz
    JiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif"
    width="200" height="200"
    alt="">

</body>
</html>
